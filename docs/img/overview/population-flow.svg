<rect width="800" height="380" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#536575"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="24" y="24" width="180" height="78" rx="6" fill="#f1f4f6"/><text x="114.0" y="53" font-size="16" fill="#18232b" text-anchor="middle" font-weight="bold">USD layers on disk</text><text x="114.0" y="79" font-size="12" fill="#18232b" text-anchor="middle" font-weight="normal">Scene and assets</text><rect x="310" y="24" width="180" height="78" rx="6" fill="#f1f4f6"/><text x="400.0" y="53" font-size="16" fill="#18232b" text-anchor="middle" font-weight="bold">USD stage</text><text x="400.0" y="79" font-size="12" fill="#18232b" text-anchor="middle" font-weight="normal">Composed scene</text><rect x="596" y="24" width="180" height="78" rx="6" fill="#f1f4f6"/><text x="686.0" y="53" font-size="16" fill="#18232b" text-anchor="middle" font-weight="bold">Runtime stage</text><text x="686.0" y="79" font-size="12" fill="#18232b" text-anchor="middle" font-weight="normal">Values + changes</text><rect x="566" y="190" width="210" height="78" rx="6" fill="#f1f4f6"/><text x="671.0" y="219" font-size="16" fill="#18232b" text-anchor="middle" font-weight="bold">1. Write changes</text><text x="671.0" y="245" font-size="12" fill="#18232b" text-anchor="middle" font-weight="normal">At a new ordinal</text><rect x="292" y="190" width="216" height="78" rx="6" fill="#f1f4f6"/><text x="400.0" y="219" font-size="16" fill="#18232b" text-anchor="middle" font-weight="bold">2. Advance watermark</text><text x="400.0" y="245" font-size="12" fill="#18232b" text-anchor="middle" font-weight="normal">Wait for completion</text><rect x="24" y="190" width="210" height="78" rx="6" fill="#f1f4f6"/><text x="129.0" y="219" font-size="16" fill="#18232b" text-anchor="middle" font-weight="bold">3. Read values</text><text x="129.0" y="245" font-size="12" fill="#18232b" text-anchor="middle" font-weight="normal">Consume, then release results</text><path d="M204,63 H304" fill="none" stroke="#536575" stroke-width="2" marker-end="url(#arrow)"/><path d="M490,63 H590" fill="none" stroke="#536575" stroke-width="2" marker-end="url(#arrow)"/><path d="M686,102 V184" fill="none" stroke="#536575" stroke-width="2" marker-end="url(#arrow)"/><path d="M566,230 H514" fill="none" stroke="#536575" stroke-width="2" marker-end="url(#arrow)"/><path d="M292,230 H240" fill="none" stroke="#536575" stroke-width="2" marker-end="url(#arrow)"/><path d="M129,268 V314 H671 V274" fill="none" stroke="#536575" stroke-width="2" marker-end="url(#arrow)"/><text x="257" y="49" font-size="12" fill="#18232b" text-anchor="middle" font-weight="normal">Load + compose</text><text x="543" y="49" font-size="13" fill="#18232b" text-anchor="middle" font-weight="bold">Population</text><text x="400" y="304" font-size="13" fill="#18232b" text-anchor="middle" font-weight="normal">Repeat runtime updates</text><text x="24" y="355" font-size="13" fill="#18232b" text-anchor="start" font-weight="normal">Population writes at a supplied ordinal; advance its watermark before reading.</text></g></svg>