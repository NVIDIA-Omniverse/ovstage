<rect width="800" height="342" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#536575"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><text x="24" y="30" font-size="18" fill="#18232b" text-anchor="start" font-weight="bold">Runtime values populated at ordinal 1</text><text x="24" y="57" font-size="13" fill="#18232b" text-anchor="start" font-weight="normal">Watermark = 1 · both prims use the same attribute types</text><text x="344" y="93" font-size="14" fill="#18232b" text-anchor="middle" font-weight="bold">/World/BodyA</text><text x="616" y="93" font-size="14" fill="#18232b" text-anchor="middle" font-weight="bold">/World/BodyB</text><text x="24" y="138" font-size="16" fill="#18232b" text-anchor="start" font-weight="bold">mass</text><text x="24" y="160" font-size="13" fill="#18232b" text-anchor="start" font-weight="normal">float</text><rect x="200" y="110" width="552" height="64" rx="4" fill="#fbe9e8"/><rect x="216" y="120" width="256" height="44" rx="4" fill="#c43c39"/><text x="344" y="148" font-size="16" fill="white" text-anchor="middle" font-weight="bold">2.0</text><rect x="488" y="120" width="256" height="44" rx="4" fill="#c43c39"/><text x="616" y="148" font-size="16" fill="white" text-anchor="middle" font-weight="bold">3.0</text><text x="24" y="220" font-size="16" fill="#18232b" text-anchor="start" font-weight="bold">velocities</text><text x="24" y="242" font-size="13" fill="#18232b" text-anchor="start" font-weight="normal">vector3f[]</text><rect x="200" y="192" width="552" height="64" rx="4" fill="#fbe9e8"/><rect x="216" y="202" width="256" height="44" rx="4" fill="#c43c39"/><text x="344" y="230" font-size="16" fill="white" text-anchor="middle" font-weight="bold">[(1, 0, 0)]</text><rect x="488" y="202" width="256" height="44" rx="4" fill="#c43c39"/><text x="616" y="230" font-size="16" fill="white" text-anchor="middle" font-weight="bold">[(0, 1, 0)]</text><text x="24" y="293" font-size="13" fill="#18232b" text-anchor="start" font-weight="normal">Each rectangle is one prim’s attribute value, written at ordinal 1.</text><text x="24" y="317" font-size="13" fill="#18232b" text-anchor="start" font-weight="normal">Only mass and velocities are shown; hierarchy and other metadata are omitted.</text></g></svg>