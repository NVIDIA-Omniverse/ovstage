<g font-family="Arial, Helvetica, sans-serif"><text x="24" y="36" font-size="18" fill="#18232b" text-anchor="start" font-weight="bold">1. Writes at 10 complete · watermark remains at 9</text><text x="197.5" y="65" font-size="13" fill="#18232b" text-anchor="middle" font-weight="normal">8</text><path d="M156,77 V231" stroke="#dce2e7" stroke-dasharray="3 4"/><text x="280.5" y="65" font-size="13" fill="#18232b" text-anchor="middle" font-weight="normal">9</text><path d="M239,77 V231" stroke="#dce2e7" stroke-dasharray="3 4"/><text x="363.5" y="65" font-size="13" fill="#18232b" text-anchor="middle" font-weight="normal">10</text><path d="M322,77 V231" stroke="#dce2e7" stroke-dasharray="3 4"/><text x="446.5" y="65" font-size="13" fill="#18232b" text-anchor="middle" font-weight="normal">11</text><path d="M405,77 V231" stroke="#dce2e7" stroke-dasharray="3 4"/><text x="529.5" y="65" font-size="13" fill="#18232b" text-anchor="middle" font-weight="normal">12</text><path d="M488,77 V231" stroke="#dce2e7" stroke-dasharray="3 4"/><text x="612.5" y="65" font-size="13" fill="#18232b" text-anchor="middle" font-weight="normal">13</text><path d="M571,77 V231" stroke="#dce2e7" stroke-dasharray="3 4"/><text x="695.5" y="65" font-size="13" fill="#18232b" text-anchor="middle" font-weight="normal">14</text><path d="M654,77 V231" stroke="#dce2e7" stroke-dasharray="3 4"/><text x="24" y="65" font-size="13" fill="#18232b" text-anchor="start" font-weight="normal">Ordinal →</text><text x="24" y="116" font-size="15" fill="#18232b" text-anchor="start" font-weight="bold">mass</text><rect x="156" y="89" width="166" height="38" rx="0" fill="#fbe9e8"/><rect x="322" y="89" width="415" height="38" rx="0" fill="#edf6de"/><rect x="331" y="93" width="65" height="30" rx="3" fill="#76b900"/><text x="363.5" y="114" font-size="12" fill="#152300" text-anchor="middle" font-weight="bold">3.0</text><path d="M322,85 V132" stroke="#18232b" stroke-width="2.5"/><text x="327" y="144" font-size="11" fill="#18232b" text-anchor="start" font-weight="normal">W = 9</text><text x="24" y="174" font-size="15" fill="#18232b" text-anchor="start" font-weight="bold">velocities</text><rect x="156" y="147" width="166" height="38" rx="0" fill="#fbe9e8"/><rect x="322" y="147" width="415" height="38" rx="0" fill="#edf6de"/><rect x="331" y="151" width="65" height="30" rx="3" fill="#76b900"/><text x="363.5" y="172" font-size="12" fill="#152300" text-anchor="middle" font-weight="bold">v₃</text><path d="M322,143 V190" stroke="#18232b" stroke-width="2.5"/><text x="327" y="202" font-size="11" fill="#18232b" text-anchor="start" font-weight="normal">W = 9</text><text x="24" y="261" font-size="13" fill="#18232b" text-anchor="start" font-weight="normal">A current read (end = UINT64_MAX) fails: their changes are beyond the watermark.</text><text x="24" y="317" font-size="18" fill="#18232b" text-anchor="start" font-weight="bold">2. Watermark advances to 10 →</text><text x="197.5" y="346" font-size="13" fill="#18232b" text-anchor="middle" font-weight="normal">8</text><path d="M156,358 V512" stroke="#dce2e7" stroke-dasharray="3 4"/><text x="280.5" y="346" font-size="13" fill="#18232b" text-anchor="middle" font-weight="normal">9</text><path d="M239,358 V512" stroke="#dce2e7" stroke-dasharray="3 4"/><text x="363.5" y="346" font-size="13" fill="#18232b" text-anchor="middle" font-weight="normal">10</text><path d="M322,358 V512" stroke="#dce2e7" stroke-dasharray="3 4"/><text x="446.5" y="346" font-size="13" fill="#18232b" text-anchor="middle" font-weight="normal">11</text><path d="M405,358 V512" stroke="#dce2e7" stroke-dasharray="3 4"/><text x="529.5" y="346" font-size="13" fill="#18232b" text-anchor="middle" font-weight="normal">12</text><path d="M488,358 V512" stroke="#dce2e7" stroke-dasharray="3 4"/><text x="612.5" y="346" font-size="13" fill="#18232b" text-anchor="middle" font-weight="normal">13</text><path d="M571,358 V512" stroke="#dce2e7" stroke-dasharray="3 4"/><text x="695.5" y="346" font-size="13" fill="#18232b" text-anchor="middle" font-weight="normal">14</text><path d="M654,358 V512" stroke="#dce2e7" stroke-dasharray="3 4"/><text x="24" y="346" font-size="13" fill="#18232b" text-anchor="start" font-weight="normal">Ordinal →</text><text x="24" y="397" font-size="15" fill="#18232b" text-anchor="start" font-weight="bold">mass</text><rect x="156" y="370" width="249" height="38" rx="0" fill="#fbe9e8"/><rect x="405" y="370" width="332" height="38" rx="0" fill="#edf6de"/><rect x="331" y="374" width="65" height="30" rx="3" fill="#c43c39"/><text x="363.5" y="395" font-size="12" fill="white" text-anchor="middle" font-weight="bold">3.0</text><path d="M405,366 V413" stroke="#18232b" stroke-width="2.5"/><text x="410" y="425" font-size="11" fill="#18232b" text-anchor="start" font-weight="normal">W = 10</text><text x="24" y="455" font-size="15" fill="#18232b" text-anchor="start" font-weight="bold">velocities</text><rect x="156" y="428" width="249" height="38" rx="0" fill="#fbe9e8"/><rect x="405" y="428" width="332" height="38" rx="0" fill="#edf6de"/><rect x="331" y="432" width="65" height="30" rx="3" fill="#c43c39"/><text x="363.5" y="453" font-size="12" fill="white" text-anchor="middle" font-weight="bold">v₃</text><path d="M405,424 V471" stroke="#18232b" stroke-width="2.5"/><text x="410" y="483" font-size="11" fill="#18232b" text-anchor="start" font-weight="normal">W = 10</text><text x="24" y="542" font-size="13" fill="#18232b" text-anchor="start" font-weight="normal">The same changes are now red. Read these values before later updates.</text><rect x="24" y="574" width="16" height="16" rx="2" fill="#c43c39"/><text x="48" y="587" font-size="13" fill="#18232b" text-anchor="start" font-weight="normal">Immutable through watermark</text><rect x="410" y="574" width="16" height="16" rx="2" fill="#76b900"/><text x="434" y="587" font-size="13" fill="#18232b" text-anchor="start" font-weight="normal">Beyond watermark: writes allowed*</text><text x="24" y="617" font-size="12" fill="#18232b" text-anchor="start" font-weight="normal">Each rectangle is a change at one ordinal; gaps mean no change shown.</text><text x="24" y="638" font-size="12" fill="#18232b" text-anchor="start" font-weight="normal">*Admission policy still applies; NONDECREASING allows equal unsealed ordinals.</text></g></svg>