[project]
name = "ovstage"
version = "0.4.0"
description = "NVIDIA OVStage Data Plane Python API"
requires-python = ">=3.10,<3.15"
dependencies = []
authors = [{name = "NVIDIA Corporation"}]
license = "LicenseRef-NvidiaProprietary"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: GPU :: NVIDIA CUDA",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Repository = "https://github.com/NVIDIA-Omniverse/ovstage"
Changelog = "https://github.com/NVIDIA-Omniverse/ovstage/blob/main/CHANGELOG.md"

[project.optional-dependencies]
docs = [
    "Pygments>=2.21.0",
    # Floor = oldest version the strict (-W) docs build is verified against;
    # cap below the next major, whose C-domain warning behavior is unproven.
    "sphinx>=7.4,<10",
    "nvidia-sphinx-theme",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    # 0.8 warns on the legacy card footers and its replacement syntax requires
    # Python >=3.11. Lift this bound when the docs can drop Python 3.10.
    "sphinx-design<0.8",
    "sphinx-mdinclude",
    # breathe 5.x (pre-release) changes what `doxygenfile` renders (it resolves
    # group-member references in file compounds); stay on the stable 4.x line
    # until 5.x is released and the rendered output is re-verified.
    "breathe>=4.36,<5",
]
test = [
    "pytest==9.2.0",
    "Pygments>=2.21.0",
    "numpy>=2.2,<2.3; python_version < '3.14'",
    "numpy==2.4.6; python_version >= '3.14'",
    "warp-lang>=1.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ovstage"]

[tool.uv]
managed = true
